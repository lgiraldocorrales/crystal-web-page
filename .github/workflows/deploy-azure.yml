name: Deploy Azure App Service

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      ASSET_BASE_URL: ${{ vars.ASSET_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run test
      - run: pip install -r requirements.txt --target=.python_packages/lib/site-packages
      - run: PYTHONPATH=.python_packages/lib/site-packages python -m unittest discover -s tests -p "test_*.py"
      - name: Package application
        run: zip -r release.zip app.py gunicorn.conf.py requirements.txt dist .python_packages
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
